name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The fixtures synthesize tool output, so the bioinformatics stack is not needed here.
      - run: pip install pandas openpyxl pytest
      - run: python -m pytest
